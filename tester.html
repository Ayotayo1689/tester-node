<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Login Tester</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --border: #d8dde6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #b42318;
      --success: #067647;
      --code: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      margin-top: 22px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(37, 99, 235, 0.14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      font-weight: 700;
    }

    .status.ok {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    pre {
      min-height: 220px;
      margin: 16px 0 0;
      padding: 16px;
      overflow: auto;
      border-radius: 8px;
      background: var(--code);
      color: #f9fafb;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .full {
      grid-column: 1 / -1;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 24px, 980px);
        padding: 20px 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Microsoft Login Tester</h1>
    <p>Use this page while the Node server is running locally.</p>

    <section class="panel">
      <form id="tester-form">
        <div class="grid">
          <div>
            <label for="base-url">Server URL</label>
            <input id="base-url" name="baseUrl" value="http://localhost:8000" autocomplete="off">
          </div>

          <div>
            <label for="api-key">API key</label>
            <input id="api-key" name="apiKey" type="password" placeholder="Only needed if API_KEY is set">
          </div>

          <div>
            <label for="method">Endpoint</label>
            <select id="method" name="method">
              <option value="/api/v1/verify-login">Hybrid</option>
              <option value="/api/v1/verify-login/browser">Browser</option>
              <option value="/api/v1/verify-login/api">Direct API</option>
            </select>
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com">
          </div>

          <div class="full">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Test Login</button>
          <button class="secondary" type="button" id="health-button">Check Health</button>
          <button class="secondary" type="button" id="clear-button">Clear</button>
        </div>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
      <pre id="output">No request sent yet.</pre>
    </section>
  </main>

  <script>
    const form = document.querySelector('#tester-form');
    const statusEl = document.querySelector('#status');
    const outputEl = document.querySelector('#output');
    const healthButton = document.querySelector('#health-button');
    const clearButton = document.querySelector('#clear-button');
    const buttons = Array.from(document.querySelectorAll('button'));

    function normalizeBaseUrl(value) {
      return value.trim().replace(/\/+$/, '');
    }

    function setBusy(isBusy) {
      buttons.forEach((button) => {
        button.disabled = isBusy;
      });
    }

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function showOutput(value) {
      outputEl.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    async function readResponse(response) {
      const text = await response.text();
      if (!text) return null;

      try {
        return JSON.parse(text);
      } catch {
        return text;
      }
    }

    async function sendRequest(path, options) {
      const formData = new FormData(form);
      const baseUrl = normalizeBaseUrl(formData.get('baseUrl'));
      const apiKey = formData.get('apiKey').trim();
      const headers = options.headers || {};

      if (apiKey) {
        headers['X-API-Key'] = apiKey;
      }

      const startedAt = performance.now();
      const response = await fetch(baseUrl + path, {
        ...options,
        headers,
      });
      const elapsedMs = Math.round(performance.now() - startedAt);
      const body = await readResponse(response);

      return {
        ok: response.ok,
        status: response.status,
        statusText: response.statusText,
        elapsedMs,
        body,
      };
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const endpoint = formData.get('method');
      const payload = {
        email: formData.get('email'),
        password: formData.get('password'),
      };

      setBusy(true);
      showStatus('Sending login test...', '');

      try {
        const result = await sendRequest(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        showStatus('HTTP ' + result.status + ' in ' + result.elapsedMs + ' ms', result.ok ? 'ok' : 'error');
        showOutput(result);
      } catch (error) {
        showStatus('Request failed', 'error');
        showOutput(error.message);
      } finally {
        setBusy(false);
      }
    });

    healthButton.addEventListener('click', async () => {
      setBusy(true);
      showStatus('Checking health...', '');

      try {
        const result = await sendRequest('/health', {
          method: 'GET',
          headers: {},
        });

        showStatus('HTTP ' + result.status + ' in ' + result.elapsedMs + ' ms', result.ok ? 'ok' : 'error');
        showOutput(result);
      } catch (error) {
        showStatus('Health check failed', 'error');
        showOutput(error.message);
      } finally {
        setBusy(false);
      }
    });

    clearButton.addEventListener('click', () => {
      showStatus('', '');
      showOutput('No request sent yet.');
    });
  </script>
</body>
</html>
